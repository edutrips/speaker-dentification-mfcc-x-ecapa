[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "closed-set-speaker-identification"
version = "0.1.0"
description = "Academic closed-set speaker identification experiment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.13,<2",
    "soundfile>=0.12,<1",
    "sounddevice>=0.5,<1",
    "librosa>=0.11,<1",
    "scikit-learn>=1.6,<2",
    "matplotlib>=3.9,<4",
    "joblib>=1.4,<2",
    "torch>=2.11,<3",
    "torchaudio>=2.11,<3",
    "speechbrain>=1.1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
